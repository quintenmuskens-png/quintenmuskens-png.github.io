<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quinten Muskens´s Homepagina</title>
    <style>
        /* Optional: Makes the buttons look nice and centered */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* This styles the link to look like a button */
        .link-button {
            display: inline-block;
            padding: 12px 24px;
            font-size: 16px;
            color: white;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
            transition: background-color 0.2s ease;
        }

        /* Changes color when you hover over it */
        .link-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="button-container">
      <span>Dit zijn links naar mijn paginas</span>
        <!-- Replace the '#' with your actual website links -->
        <a href="https://quintenmuskens-png.github.io/garmin" target="_blank" class="link-button">Link 1-Mijn site voor QR codes</a>
        <a href="https://quintenmuskens-png.github.io/cloudwise" target="_blank" class="link-button">Link 2-Cloudwise</a>
        <a href="https://quintenmuskens-png.github.io/voicerecorder" class="link-button">Link 3-Voicerecorder</a>
      <a href="https://quintenmuskens-png.github.io/ict-projects" class="link-button">Link 4-ICT-Projects</a>
      <a href="https://quintenmuskens-png.github.io/podcastnl" class="link-button">Link 5-PodcastNL</a>
         <a href="https://youtube.com/@isgeheim-roblox" class="link-button">Abonneer op mijn kanaal!</a>
        <a href="https://github.com/quintenmuskens-png" class="link-button">Volg mij op Github!</a>
   <a href="https://www.roblox.com/users/4697582113/profile" class="link-button">Volg mij op Roblox!</a>
    </div>

</body>
</html>
